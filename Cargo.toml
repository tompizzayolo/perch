[package]
name = "perch"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[dependencies]
bevy = { version = "=0.20.0-rc.2", default-features = false, features = ["3d", "ui", "bevy_feathers", "bevy_dev_tools", "render_dev_tools", "bevy_core_pipeline"] }
